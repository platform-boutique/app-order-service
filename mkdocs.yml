  - Architecture: architecture.md
  - API: api.md
  - Configuration: configuration.md
  - Observability: observability.md
  - Operations: operations.md
  - Develop & test: development.md
  - Decisions:
      - "1. One Postgres per service": adr/0001-one-postgres-per-service.md
      - "2. Computed order status": adr/0002-computed-order-status.md
      - "3. Kafka consumer": adr/0003-orders-placed-consumer.md
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
plugins:
  - techdocs-core
